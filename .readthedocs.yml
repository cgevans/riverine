version: 2
sphinx:
  configuration: docs/source/conf.py
build:
    os: ubuntu-24.04
    tools:
        python: "3.12"
    jobs:
        # hatch-vcs derives the version from git tags, but Read the Docs does a
        # shallow clone without tags by default. Without this, the version falls
        # back to "0.1.devN". Unshallow + fetch tags so the version is correct.
        post_checkout:
            - git fetch --unshallow || true
            - git fetch --tags --force
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
