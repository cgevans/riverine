[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# addopts = "--cov alhambra --cov-report term-missing --cov-report html"
norecursedirs = [
    "dist",
    "build",
    ".tox"]
testpaths = ["tests"]
filterwarnings = [
    # During the deprecation period, legacy tests still exercise the
    # fixed_total_volume=/buffer_name= API.  Silence the warning by default;
    # dedicated tests assert it with pytest.warns, and it can be surfaced with
    # `pytest -W error::riverine._warnings.RiverineDeprecationWarning`.
    "ignore::riverine._warnings.RiverineDeprecationWarning",
]

[project]
name = "riverine"
version = "0.7.2.dev0"
description = "Many-component mix library for molecular programming"
authors = [{name = "Constantine Evans", email="mixes@mb.costi.net"}]
license = { file = "LICENSE.txt" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed"]
dependencies = [
    "attrs >= 22.1",
    "kithairon >= 0.2.0",
    "numpy",
    "pandas",
    "openpyxl",
    "pint >= 0.20",
    "polars[pandas,numpy] ~= 1.4",
    "tabulate",
    "typing_extensions >= 4.2",
]
readme = "README.md"
requires-python = ">= 3.10"

[project.urls]
Homepage = "https://github.com/cgevans/riverine"
Documentation = "https://riverine.readthedocs.io"
Repository = "https://github.com/cgevans/riverine.git"
Issues = "https://github.com/cgevans/riverine/issues"

[project.optional-dependencies]
docs = [
    "numpydoc",
    "matplotlib",
    "sphinx-book-theme",
    "sphinx-autoapi",
    "myst-parser"
    ]
testing = [
    "setuptools",
    "pytest",
    "pytest-cov",
]
all = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "hypothesis",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py312"]

[tool.mypy]
python_version = "3.10"
# warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
#disallow_untyped_defs = true
#disallow_incomplete_defs = true

[tool.ruff]
ignore = ["TID252", "N816", "F405", "F403", "ARG002"
    # For now
    , "EM101", "EM102", "RET505", "RET504", "TRY003", "PLR2004"
]